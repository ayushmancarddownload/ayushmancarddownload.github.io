name: Generate Astro Blog Post

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'Enter YouTube Video URL'
        required: true

# Code push karne ke liye write permission
permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI
        run: |
          pip install google-genai

      - name: Generate Post from YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py "${{ github.event.inputs.youtube_url }}"

      - name: Commit and Push to Astro Blog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git commit -m "Add new blog post from YouTube [skip ci]" || exit 0
          git push
