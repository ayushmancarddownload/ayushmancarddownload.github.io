name: Generate Astro Blog Post

on:
  workflow_dispatch: # Actions tab se direct 1-click run karne ke liye
  push:
    paths:
      - 'transcript.txt' # transcript.txt me save karte hi apne aap chalega

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI
        run: |
          pip install google-genai

      - name: Generate Post from Transcript
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_post.py

      - name: Commit and Push to Astro Blog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto publish new post from transcript.txt" || exit 0
          git push
